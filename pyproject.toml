[project]
name = "sciologer"
version = "0.2.0"
description = "Explore relationships among papers, authors, MeSH terms, journals, institutions, grants and substances in PubMed results"
readme = "README.md"
authors = [{ name = "Michael Bales" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "lxml>=5.3",
    "model2vec>=0.10.0",
    "networkx>=3.4",
    "numpy>=2.0",
    "pydantic>=2.9",
    "scikit-learn>=1.9.1",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.scripts]
sciologer = "sciologer.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sciologer"]
artifacts = ["sciologer/static/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
